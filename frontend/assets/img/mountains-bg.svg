<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2735"/>
      <stop offset="55%" stop-color="#26364a"/>
      <stop offset="100%" stop-color="#0f1722"/>
    </linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a5c"/>
      <stop offset="100%" stop-color="#22303f"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3a4a"/>
      <stop offset="100%" stop-color="#18232f"/>
    </linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2732"/>
      <stop offset="100%" stop-color="#0e1620"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9d6de" stop-opacity="0"/>
      <stop offset="60%" stop-color="#c9d6de" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c9d6de" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- far ridge -->
  <path d="M0,430 L90,380 190,420 300,350 420,400 540,340 660,390 780,330 900,385 1020,335 1140,395 1260,345 1380,400 1500,360 1600,410 1600,1000 0,1000 Z" fill="url(#m3)" opacity="0.85"/>
  <rect x="0" y="330" width="1600" height="150" fill="url(#fog)"/>

  <!-- mid ridge -->
  <path d="M0,560 L120,480 240,540 340,460 460,530 580,470 700,545 820,470 940,540 1060,480 1180,550 1300,470 1420,540 1600,490 1600,1000 0,1000 Z" fill="url(#m2)"/>
  <rect x="0" y="470" width="1600" height="160" fill="url(#fog)"/>

  <!-- near ridge -->
  <path d="M0,700 L140,600 260,670 380,590 520,680 640,600 760,690 900,600 1020,680 1160,610 1300,690 1440,610 1600,680 1600,1000 0,1000 Z" fill="url(#m1)"/>
  <rect x="0" y="600" width="1600" height="180" fill="url(#fog)"/>

  <!-- foreground tree silhouette band -->
  <path d="M0,1000 L0,820 C120,790 220,850 340,810 C460,770 560,840 680,800 C800,760 900,830 1020,800 C1140,770 1260,830 1380,800 C1460,780 1540,820 1600,800 L1600,1000 Z" fill="#0a1119" opacity="0.9"/>

  <rect width="1600" height="1000" fill="url(#vig)"/>
</svg>
